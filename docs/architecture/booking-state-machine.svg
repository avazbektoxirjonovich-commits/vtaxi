<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0B6E75"/>
    </marker>
  </defs>
  <rect width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#16212C">VTaxi — Booking State Machine</text>
  <text x="380" y="48" text-anchor="middle" font-size="10" fill="#55606B">application/booking/booking_service.py (620 lines, implemented)</text>

  <rect x="30" y="90" width="130" height="46" rx="8" fill="#DCEEEE" stroke="#0B6E75"/>
  <text x="95" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="#16212C">PENDING</text>
  <line x1="160" y1="113" x2="220" y2="113" stroke="#0B6E75" stroke-width="2" marker-end="url(#a)"/>

  <rect x="220" y="90" width="130" height="46" rx="8" fill="#DCEEEE" stroke="#0B6E75"/>
  <text x="285" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="#16212C">RESERVED</text>
  <line x1="350" y1="113" x2="410" y2="113" stroke="#0B6E75" stroke-width="2" marker-end="url(#a)"/>

  <rect x="410" y="90" width="130" height="46" rx="8" fill="#DCEEEE" stroke="#0B6E75"/>
  <text x="475" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="#16212C">ACCEPTED</text>
  <line x1="540" y1="113" x2="600" y2="113" stroke="#0B6E75" stroke-width="2" marker-end="url(#a)"/>

  <rect x="600" y="90" width="130" height="46" rx="8" fill="#122029" stroke="#0B6E75"/>
  <text x="665" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">COMPLETED</text>

  <text x="380" y="200" text-anchor="middle" font-size="11" fill="#93590A" font-weight="600">Terminal exits, reachable from PENDING / RESERVED / ACCEPTED:</text>

  <rect x="60"  y="230" width="150" height="44" rx="8" fill="#F4F5F2" stroke="#DCE0DA"/>
  <text x="135" y="257" text-anchor="middle" font-size="11" fill="#16212C" font-weight="600">REJECTED</text>

  <rect x="240" y="230" width="150" height="44" rx="8" fill="#F4F5F2" stroke="#DCE0DA"/>
  <text x="315" y="257" text-anchor="middle" font-size="11" fill="#16212C" font-weight="600">CANCELLED</text>

  <rect x="420" y="230" width="150" height="44" rx="8" fill="#F4F5F2" stroke="#DCE0DA"/>
  <text x="495" y="257" text-anchor="middle" font-size="11" fill="#16212C" font-weight="600">EXPIRED</text>

  <line x1="95" y1="136" x2="135" y2="230" stroke="#8A939B" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="285" y1="136" x2="315" y2="230" stroke="#8A939B" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="475" y1="136" x2="495" y2="230" stroke="#8A939B" stroke-width="1.5" stroke-dasharray="4 3"/>

  <text x="380" y="320" text-anchor="middle" font-size="10" fill="#8A939B">Cross-service seat synchronization is enforced on every transition (booking_service.py).</text>
</svg>
