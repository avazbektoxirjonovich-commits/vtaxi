  <rect width="780" height="460" fill="#FFFFFF"/>
  <text x="390" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#16212C">VTaxi — Database (core relationships)</text>
  <text x="390" y="48" text-anchor="middle" font-size="10" fill="#55606B">21 tables total in the initial migration — core entities shown below</text>

  <rect x="320" y="76" width="140" height="42" rx="8" fill="#122029" stroke="#0B6E75"/>
  <text x="390" y="102" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="600">users</text>

