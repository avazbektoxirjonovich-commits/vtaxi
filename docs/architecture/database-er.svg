  <text x="275" y="250" text-anchor="middle" font-size="11" fill="#16212C" font-weight="600">driver_documents</text>

  <rect x="380" y="224" width="150" height="42" rx="8" fill="#DCEEEE" stroke="#0B6E75"/>
